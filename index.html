<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .catalog-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        
        /* Product Card Styling */
        .product-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-image { width: 100%; height: 200px; background-color: #eee; border-radius: 8px; object-fit: cover; margin-bottom: 15px; }
        
        .product-title { font-size: 1.2rem; color: #333; margin: 10px 0; }
        .product-price { font-size: 1.1rem; color: #28a745; font-weight: bold; margin-bottom: 15px; }
        
        .buy-btn { display: inline-block; background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .buy-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<h1 style="text-align: center; color: #333;">Our Products</h1>

<div class="catalog-container">
    <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 1" class="product-image">
        <div class="product-title">Smart Watch Pro</div>
        <div class="product-price">$199.00</div>
        <a href="checkout.html" class="buy-btn">Buy Now</a>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 2" class="product-image">
        <div class="product-title">Wireless Headphones</div>
        <div class="product-price">$89.00</div>
        <a href="checkout.html" class="buy-btn">Buy Now</a>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 3" class="product-image">
        <div class="product-title">Premium Camera</div>
        <div class="product-price">$549.00</div>
        <a href="checkout.html" class="buy-btn">Buy Now</a>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 4" class="product-image">
        <div class="product-title">Leather Laptop Bag</div>
        <div class="product-price">$120.00</div>
        <a href="checkout.html" class="buy-btn">Buy Now</a>
    </div>
</div>

</body>
</html>
