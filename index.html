<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop - Catalog & Checkout</title>
    <style>
        /* General Styles */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; color: #333; scroll-behavior: smooth; }
        header { background: #333; color: white; padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 100; }
        .section-title { text-align: center; margin: 40px 0; font-size: 2rem; }

        /* Catalog Grid */
        .catalog-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto 50px auto; 
            padding: 0 20px;
        }
        .product-card { 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            text-align: center; 
            transition: 0.3s;
        }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 200px; border-radius: 8px; object-fit: cover; background: #eee; }
        .price { font-size: 1.4rem; color: #2ecc71; font-weight: bold; margin: 15px 0; }
        .buy-btn { 
            background: #007bff; color: white; border: none; padding: 12px 25px; 
            border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block;
        }
        .buy-btn:hover { background: #0056b3; }

        /* Checkout Section */
        .checkout-section { background: #ffffff; padding: 50px 20px; border-top: 2px solid #eee; }
        .form-container { max-width: 600px; margin: auto; background: #f9f9f9; padding: 30px; border-radius: 10px; border: 1px solid #ddd; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .submit-btn { 
            width: 100%; background: #28a745; color: white; border: none; padding: 15px; 
            font-size: 1.2rem; border-radius: 6px; cursor: pointer; margin-top: 10px;
        }
        .submit-btn:hover { background: #218838; }
    </style>
</head>
<body>

<header>
    <h1>E-Commerce Store</h1>
</header>

<div class="section-title">Product Catalog</div>

<div class="catalog-container">
    <div class="product-card">
        <img src="https://picsum.photos/300/200?random=1" alt="Product" class="product-img">
        <h3>Ultra Headphones</h3>
        <p>Noise cancelling wireless tech.</p>
        <div class="price">$99.00</div>
        <button class="buy-btn" onclick="selectProduct('Ultra Headphones')">Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/300/200?random=2" alt="Product" class="product-img">
        <h3>Smart Watch V2</h3>
        <p>Track your health and time.</p>
        <div class="price">$149.00</div>
        <button class="buy-btn" onclick="selectProduct('Smart Watch V2')">Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/300/200?random=3" alt="Product" class="product-img">
        <h3>Designer Backpack</h3>
        <p>Waterproof and stylish.</p>
        <div class="price">$75.00</div>
        <button class="buy-btn" onclick="selectProduct('Designer Backpack')">Buy Now</button>
    </div>
</div>

<div class="checkout-section" id="checkout">
    <div class="section-title">Checkout Details</div>
    <div class="form-container">
        <form id="orderForm">
            <div class="form-group">
                <label>Selected Product</label>
                <input type="text" id="selected_product" readonly style="background: #e9ecef;">
            </div>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="cust_name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="cust_email" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="cust_phone" placeholder="+1 234 567 890" required>
            </div>

            <div class="form-group">
                <label>Shipping Address</label>
                <textarea id="cust_address" rows="3" placeholder="Street, City, Zip Code" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Confirm Order</button>
        </form>
    </div>
</div>

<script>
    // Function to handle "Buy Now" button click
    function selectProduct(name) {
        document.getElementById('selected_product').value = name;
        document.getElementById('checkout').scrollIntoView();
    }

    // Handle form submission
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const orderData = {
            product: document.getElementById('selected_product').value,
            name: document.getElementById('cust_name').value,
            email: document.getElementById('cust_email').value,
            phone: document.getElementById('cust_phone').value,
            address: document.getElementById('cust_address').value
        };

        if(!orderData.product) {
            alert("Please select a product first!");
            return;
        }

        console.log("Order Received:", orderData);
        alert("Order Successful!\nProduct: " + orderData.product + "\nWe will contact you at " + orderData.phone);
    });
</script>

</body>
</html>
